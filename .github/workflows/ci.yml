name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version-file: pyproject.toml
      - name: Install the frozen CPU, test and desktop environment
        run: uv sync --frozen --managed-python --no-default-groups --extra cpu --extra test --group desktop
      - name: Lock and Python/Electron release contracts must be current
        run: |
          uv lock --check
          uv run --frozen --no-sync python tools/release/write_env_contract.py --check

      - name: Lint (ratcheted against docs/verification/RUFF_BASELINE.txt)
        run: |
          # No `|| true`. The checker keys on (rule, file) and compares COUNTS, so fixing one of two
          # findings is an improvement rather than "new debt", and a ruff that could not run fails
          # instead of looking like a clean tree. Negative controls: tests/test_ci_gates.py.
          set +e
          uv run --frozen --no-sync ruff check --output-format=json leafmachine3 tests > ruff.json
          ruff_status=$?
          set -e
          uv run --frozen --no-sync python tools/ci/check_lint_ratchet.py \
            --json ruff.json --status "$ruff_status" \
            --baseline docs/verification/RUFF_BASELINE.txt

      - name: Test, gated on the persisted baseline
        run: |
          # -rfE so BOTH `FAILED` and `ERROR` short-summary lines are printed; a fixture that raises
          # reports ERROR, never FAILED, and a gate that greps only FAILED waves it straight through.
          # PIPESTATUS[0] because `| tee` otherwise reports tee's status and hides pytest exiting
          # 2 (interrupted), 3 (internal error), 4 (usage) or 5 (nothing collected).
          set +e
          uv run --frozen --no-sync python -m pytest tests/ -q -rfE 2>&1 | tee pytest.log
          pytest_status=${PIPESTATUS[0]}
          set -e
          uv run --frozen --no-sync python tools/ci/check_test_baseline.py \
            --log pytest.log --status "$pytest_status" \
            --baseline docs/verification/STEP2_BASELINE_NODE_IDS.txt

      - name: An INSTALLED wheel must contain the whole application
        run: |
          # Building a wheel and reading its zip index proves what was packaged; it does not prove
          # the result imports, resolves its resources, or exposes its console scripts. This installs
          # it into a throwaway venv and exercises it from an unrelated working directory.
          uv run --frozen --no-sync python -m pytest tests/test_version_identity.py -q -m slow -rs

  # §4 Step 2 exit gate: "the primitives pass in isolation on all three platforms", and §2.2's
  # kill-the-root test is "a first-class CI job, not an extrapolation from the POSIX result — the
  # two implementations share no mechanism". §7 "Platform CI" names Linux, macOS and Windows. The
  # `test` job above covers Linux; this one covers the other two.
  #
  # Deliberately scoped to the runtime primitive files rather than all of `tests/`: the exit gate is
  # "in isolation", and a whole-suite run on a fresh runner drowns the platform signal in unrelated
  # optional-dependency failures (the `ModuleNotFoundError: No module named 'ect'` family).
  #
  # No `-p no:recording` here: that flag exists only for developer interpreters where
  # pytest-recording and pytest-vcr collide, and `.[cpu,dev]` installs neither.
  #
  # These runners provide the native evidence; Linux fakes alone do not qualify a release.
  platform-primitives:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # The last run before this cap hung on Windows for 6 h until GitHub's default limit cancelled
    # it; macOS finishes in about a minute. A hang must cost minutes, not the runner's day.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version-file: pyproject.toml
      - name: Install the frozen platform and test environment
        env:
          LM3_EXTRA: ${{ matrix.os == 'macos-latest' && 'macos' || 'cpu' }}
        run: uv sync --frozen --managed-python --no-default-groups --extra "$LM3_EXTRA" --extra test
      # Steps 2 AND 3. Gate 17 is "the launch handshake and process-tree Stop pass on Windows CI,
      # not only the lock adapter" -- so a list containing only the Step 2 primitive files leaves
      # that gate unmet BY CONSTRUCTION, however green it runs. The section 2.4 handshake is the
      # part with a genuinely different Windows implementation (STARTUPINFOEX handle allowlist
      # instead of pass_fds, a job object instead of a process group), which is exactly why the
      # plan singles it out.
      - name: Step 2 + 3 runtime primitives and handshake (isolated)
        run: >
          uv run --frozen --no-sync python -m pytest -q -rs
          tests/test_runtime_lease.py
          tests/test_runtime_lease_windows.py
          tests/test_runtime_records.py
          tests/test_runtime_grant.py
          tests/test_runtime_config_io.py
          tests/test_runtime_isolation.py
          tests/test_runtime_launch.py
          tests/test_runtime_execution.py
          tests/test_server_handshake.py
          tests/test_setup_runtime.py
          tests/test_machine3_runtime.py
          tests/test_paths.py
          tests/test_setup_paths.py
          tests/test_settings_path_unification.py
      # These `skipif(sys.platform != "win32")` tests touch the real object manager -- the one thing
      # the Linux fakes cannot establish (event lifetime/identity, STARTUPINFOEX, and a Job Object
      # actually terminating a descendant). They are named here so the Windows leg proves they RAN;
      # the step above already ran them, but a skip there would pass silently.
      - name: The real Win32 surface must not have skipped
        if: matrix.os == 'windows-latest'
        # bash (git-bash on the Windows runner) rather than PowerShell, because GitHub runs it with
        # `set -eo pipefail`, so the grep guards below are load-bearing and `tee` cannot swallow
        # pytest's exit code.
        shell: bash
        run: |
          uv run --frozen --no-sync python -m pytest -q -rs \
            "tests/test_runtime_lease_windows.py::test_the_real_allowlist_is_a_startupinfo" \
            "tests/test_runtime_lease_windows.py::test_the_real_surface_acquires_and_releases" \
            "tests/test_server_handshake.py::test_the_real_windows_job_object_stops_root_and_grandchild" \
            | tee win32-real-surface.log
          # pytest exits 0 on a skip, so a passing run is NOT by itself proof that the real object
          # manager was touched. These two lines are the actual assertion behind gate 27's
          # "verified against the Windows adapter itself, not inferred from the POSIX result".
          grep -q "3 passed" win32-real-surface.log
          ! grep -qi "skipped" win32-real-surface.log

  desktop:
    name: Desktop shell (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      LM3_EXTRA: ${{ matrix.os == 'macos-latest' && 'macos' || 'cpu' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version-file: pyproject.toml
      - name: Install the frozen Python, Node and npm environment
        run: uv sync --frozen --managed-python --no-default-groups --extra "$LM3_EXTRA" --group desktop
      - name: Verify both release contracts
        run: |
          uv lock --check
          uv run --frozen --no-sync python tools/release/write_env_contract.py --check
      - name: Install integrity-pinned Electron packages
        run: uv run --frozen --no-sync lm3-desktop install
      - name: Server discovery, deployment identity, and ownership tests
        run: uv run --frozen --no-sync lm3-desktop test
      - name: Package the native shell (unsigned CI build)
        run: uv run --frozen --no-sync lm3-desktop pack -- -c.mac.hardenedRuntime=false -c.mac.notarize=false
      - name: Packaged Linux GUI must use uv and respect backend ownership
        if: matrix.os == 'ubuntu-latest'
        run: uv run --frozen --no-sync python tools/ci/smoke_desktop.py
      - name: Save native package for smoke testing
        uses: actions/upload-artifact@v4
        with:
          name: desktop-shell-${{ matrix.os }}-${{ github.sha }}
          path: app/dist/
          retention-days: 7
          if-no-files-found: error
