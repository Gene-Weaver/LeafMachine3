name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (CPU, no heavy ML deps)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[cpu,dev]"
      - name: Lint
        run: ruff check leafmachine3 || true
      - name: Test (mock pipeline — no models/GPU required)
        run: pytest -q
