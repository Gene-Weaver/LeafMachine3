[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leafmachine3"
# THE authoritative LM3 version. Everything else derives from it:
#   - leafmachine3.__version__ reads it back with importlib.metadata
#   - the server, /healthz and the hardware profile import that
#   - the runtime launch manifest records it
#   - app/package.json is checked against it by tests/test_version_identity.py
# It was 0.1.0 here while the server, Electron and the hardware profile all said 3.0.0, so a launch
# manifest recorded 0.1.0 for a run whose /healthz advertised 3.0.0.
dynamic = ["version"]   # the one LM3 version: the VERSION file beside uv.lock (see tools/release/bump_version.py)
description = "LeafMachine3 — herbarium specimen image analysis pipeline (runtime)"
readme = "README.md"
# Exactly one interpreter line, uv-managed (see .python-version and tools/release/versions.env).
requires-python = ">=3.11,<3.12"
license = { text = "GPL-3.0-only" }
authors = [{ name = "William Weaver", email = "willwe@umich.edu" }]
keywords = ["herbarium", "computer-vision", "segmentation", "phenology", "botany"]

# Runtime is EXPORTED models only. No torch, no ultralytics: the YOLO26 detector / segmenter / pose
# exports are end2end ONNX graphs driven by onnxruntime through inference/ultra_replacements.py.
#
# Every direct pin is EXACT and is the version the pipeline was verified with. uv.lock pins the rest
# (transitive deps, with hashes). Change a pin only in an env-bump commit that re-locks
# (`uv lock`), regenerates the contract (`python tools/release/write_env_contract.py`) and re-runs
# the regression comparison (PACKAGING_PLAN.md section 11).
dependencies = [
    "numpy==2.4.4",
    "opencv-python-headless==5.0.0.93",
    "pillow==12.2.0",
    "pyyaml==6.0.3",
    "scipy==1.17.1",
    "psutil==7.2.2",
    "shapely==2.1.2",
    # Model installer: fetches the pinned default models from the Hugging Face Hub (lm3 models install).
    "huggingface_hub==0.36.0",
    # Server: the browser GUI is the primary interface, so it is part of every install.
    "fastapi==0.141.1",
    "uvicorn==0.52.0",
    "python-multipart==0.0.32",
    "sse-starlette==3.4.6",
    # ECT stage
    "ect==1.3.0",
    "h5py==3.16.0",
    "matplotlib==3.11.1",
    # Postprocessing tools (mask -> STL, collage): small wheels on every target.
    "trimesh==4.12.2",
    "mapbox_earcut==2.0.0",
]

[project.optional-dependencies]
# HARDWARE: choose exactly one (uv enforces it; see [tool.uv] conflicts). These are the ONLY
# packages that differ between platforms.
#
# gpu: onnxruntime-gpu 1.20.2 is the CUDA 12 / cuDNN 9 build (1.28+ is CUDA 13 and needs driver
# >= 580). The nvidia-* wheels are exactly the libraries libonnxruntime_providers_cuda.so and cuDNN 9
# link (ldd), so the only system requirement is the NVIDIA driver; `lm3 doctor` checks its version.
gpu = [
    "onnxruntime-gpu==1.20.2; sys_platform != 'darwin'",
    "nvidia-ml-py==13.610.43; sys_platform != 'darwin'",       # provides the `pynvml` module
    "nvidia-cuda-runtime-cu12==12.4.127; sys_platform != 'darwin'",
    "nvidia-cuda-nvrtc-cu12==12.4.127; sys_platform != 'darwin'",
    "nvidia-cublas-cu12==12.4.5.8; sys_platform != 'darwin'",
    "nvidia-cudnn-cu12==9.1.0.70; sys_platform != 'darwin'",
    "nvidia-cufft-cu12==11.2.1.3; sys_platform != 'darwin'",
    "nvidia-curand-cu12==10.3.5.147; sys_platform != 'darwin'",
]
cpu = ["onnxruntime==1.20.1"]
macos = ["onnxruntime==1.20.1; sys_platform == 'darwin'"]   # the macOS wheel exposes CoreMLExecutionProvider
# Kept as an EMPTY alias: the server packages are now base dependencies, but `.[cpu,dev,server,test]`
# style installs written before the fold (CI, docs) must still resolve. Remove with the CI rewrite.
server = []
# ruff is pinned EXACTLY: docs/verification/RUFF_BASELINE.txt was recorded with 0.12.1, and every
# ruff release adds rules, so a floating ruff turns the lint ratchet red with "new" debt nobody wrote.
# Bump it only together with a deliberately regenerated baseline.
dev = ["pytest>=8.0", "ruff==0.12.1"]
# Everything CI needs to RUN the suite and the gates. `dev` was not enough: fastapi's base
# dependency does not pull httpx -- it lives in fastapi's own optional extras -- and
# `starlette.testclient.TestClient` imports it at construction, so `.[cpu,dev,server]` still failed
# at COLLECTION on a clean runner. `build` is needed by the wheel-contract test, and pytest-xdist by
# gate 46, which asserts each xdist worker gets its own deployment id.
test = [
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "ruff==0.12.1",                  # see `dev`: the lint baseline is tied to this exact version
    "httpx>=0.27",
    # Starlette 1.x moved TestClient to httpx2 while retaining an httpx fallback for
    # older installations. Keep both so the unbounded supported FastAPI/Starlette
    # range is testable at either end.
    "httpx2>=2.0",
    "build>=1.2",
    # tests/test_version_identity.py imports setuptools.find_packages to check the package finder.
    # pip-made venvs happen to contain setuptools; uv-made ones do not, so it has to be declared.
    "setuptools>=68",
    # tests/test_ruler_classifier.py builds a tiny real ONNX classifier to prove a member whose
    # output size disagrees with the label map is refused. onnx otherwise lives only in the
    # dev-only `full` group, which no CI leg installs, so without this line that test could
    # never run on a runner. Pure-Python wheel; none of the cv2/torch conflicts that keep `full` out.
    "onnx==1.22.0; sys_platform == 'linux'",
    # The platform-primitives CI leg runs pytest --timeout so a hung Windows test is named, not waited on.
    "pytest-timeout>=2.3",
]

# DEVELOPMENT ONLY -- never shipped. Locked in uv.lock so it is reproducible, but no user instruction,
# Dockerfile, wheelhouse or user-facing CI leg installs it. It is what the ultralytics-parity tests,
# tools/verification/ab_ultralytics_vs_ultra_rep.py and the experiments need:
#     uv sync --frozen --extra gpu --group full
# ultralytics depends on opencv-python, which installs the SAME `cv2/` directory as production's
# opencv-python-headless. With both present, removing the group (going back to production) deletes
# cv2 out from under the headless package -- found on 2026-10-07. [tool.uv] override-dependencies
# removes opencv-python from the resolution entirely, so ultralytics uses the headless cv2 and dev and
# production run one OpenCV build. Linux only (the lab box); the PyTorch cu124 index has no macOS wheels.
# NEVER run ultralytics on a CPU device in this environment: its ONNX backend `pip install`s the CPU
# onnxruntime over onnxruntime-gpu (check_requirements). See PACKAGING_PLAN.md section 13.
[dependency-groups]
# Desktop tooling is installed by uv, including Node/npm and the uv executable Electron uses.
# JavaScript packages remain integrity-pinned in app/package-lock.json (npm's lock format).
desktop = ["nodejs-wheel==24.19.0", "uv==0.12.23"]
full = [
    "torch==2.6.0; sys_platform == 'linux'",
    "torchvision==0.21.0; sys_platform == 'linux'",
    "ultralytics==8.4.107; sys_platform == 'linux'",
    "onnx==1.22.0; sys_platform == 'linux'",
]

[tool.uv]
# The uv version, the Python patch and the supported platforms are part of the release contract.
# tools/release/versions.env is the single source; tests/test_release_identity.py checks agreement.
required-version = "==0.12.23"
python-preference = "only-managed"
# Resolve ONLY for the supported targets, and refuse to lock if any package lacks a wheel for one of
# them -- a missing wheel is a lock-time error here, never an install-time surprise on a user's box.
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
# opencv-python (ultralytics' dependency) is never installed: it shares the cv2/ directory with
# opencv-python-headless, and uninstalling either deletes the other's files. See [dependency-groups].
override-dependencies = ["opencv-python; sys_platform == 'never'"]
conflicts = [
    [{ extra = "gpu" }, { extra = "cpu" }],
    [{ extra = "gpu" }, { extra = "macos" }],
    [{ extra = "cpu" }, { extra = "macos" }],
]

# The PyTorch index serves ONLY the dev group; user resolutions never touch it.
[tool.uv.sources]
torch = [{ index = "pytorch-cu124", group = "full" }]
torchvision = [{ index = "pytorch-cu124", group = "full" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[project.scripts]
machine3 = "leafmachine3.machine3:main"
lm3-setup = "leafmachine3.setup.hardware_setup:main"
# The canonical LM3 command. The plan specifies `lm3 serve` (section 3.1's settings contract and
# Step 5's exit gate) and anticipates `lm3 connect`; a separate `lm3-serve` script would have been a
# second public spelling of one command -- the redundant control surface this refactor removes.
# Until now the only way to start the server was `python -m leafmachine3.server`, so an installed
# wheel had no documented way to run it at all.
lm3 = "leafmachine3.cli:main"
lm3-desktop = "leafmachine3.desktop:main"

[project.urls]
Homepage = "https://github.com/Gene-Weaver/LeafMachine3"

[tool.setuptools.dynamic]
# VERSION is the single LM3 version. Everything else derives from it: leafmachine3.__version__,
# the env/desktop contracts, app/package.json (synced by tools/release/bump_version.py) and the
# models lock stamp. Bump it with the script, never by hand in several places.
version = {file = "VERSION"}

[tool.setuptools.packages.find]
# `leafmachine3*` also globs `leafmachine3_backup*` -- 13 packages and 13 MB of superseded code that
# would ship in every wheel. Exclude it explicitly; a narrower include pattern would still match.
include = ["leafmachine3*"]
exclude = ["leafmachine3_backup*", "leafmachine3.egg-info*"]

[tool.setuptools.package-data]
# `leafmachine3/server/ui/` has no __init__.py, so packages.find does not see it and its 12 files --
# index.html, the JS bundle, the CSS and settings_meta.json -- were absent from the wheel. The
# browser UI is not optional: it is the entire interface for the loopback and SSH-tunnelled cluster
# deployments, so an installed LM3 without it serves 404 at "/".
leafmachine3 = [
    "_env_contract.json",          # what a correct production install holds; read by `lm3 doctor`
    "modelhub/models.lock.yaml",   # the pinned default-model registry read by `lm3 models`
    "core/schema.sql",
    "server/ui/*",
    "server/ui/css/*",
    "server/ui/js/*",
    "server/ui/js/tabs/*",
]
# The calibration sheets are resolved with importlib.resources (paths.calibration_images_dir), so
# they MUST ship inside the package -- an install that omits them silently drops `--calibrate` back
# to heuristic VRAM estimates. Downscaled copies of examples/images, ~7 MB total; see that package's
# README before swapping the set.
"leafmachine3.setup.calibration_images" = ["*.jpg", "README.md"]
# The STL web deliverable. `electron_app_plan.md` and closeout finding F-017 both call for it to
# ship, and before this the wheel contained `_build.py` and NOTHING ELSE from that tree -- a build
# script with no inputs, which is the worst of both options. `stl_webview/` has no `__init__.py`, so
# packages.find never saw it; declaring it as package data of the parent package ships the generated
# single-file page, its sources, and the fonts and sample masks `_build.py` inlines. ~1.1 MB.
"leafmachine3.postprocessing" = [
    "stl_webview/*.html",
    "stl_webview/*.md",
    "stl_webview/src/*",
    "stl_webview/assets/*",
    "stl_webview/assets/fonts/*",
]

[tool.pytest.ini_options]
markers = [
    "slow: builds a wheel or otherwise takes seconds; CI runs these, `-m 'not slow'` skips them",
    "characterization: pins PRE-refactor behavior, including behavior the consensus plan calls a defect; expected to change deliberately",
]

[tool.ruff]
line-length = 110
target-version = "py310"
