[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leafmachine3"
version = "0.1.0"
description = "LeafMachine3 — herbarium specimen image analysis pipeline (runtime)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "William Weaver", email = "willwe@umich.edu" }]
keywords = ["herbarium", "computer-vision", "segmentation", "phenology", "botany"]

# Runtime is EXPORTED models only — no torch/CUDA training stack required for CPU/DirectML/CoreML.
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "pillow>=10.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# GPU-first onnxruntime for NVIDIA boxes; swap for onnxruntime (CPU) / CoreML (macOS) per platform.
# onnxruntime-gpu is capped below 1.21: 1.28+ is a CUDA-13 build (needs driver >= 580); the pinned
# requirements/ files use the CUDA-12 combo. The torch CUDA wheel must come from the PyTorch index —
# see requirements/requirements-gpu.txt and INSTALL.md (ultralytics pulls torch transitively).
gpu = ["onnxruntime-gpu>=1.19,<1.21", "pynvml>=11.5"]
cpu = ["onnxruntime>=1.19"]
macos = ["onnxruntime>=1.19"]   # macOS wheel exposes CoreMLExecutionProvider; torch uses MPS
# Ultralytics AutoBackend drives the YOLO26 detector/segmenter/pose exports (.onnx and .pt).
yolo = ["ultralytics>=8.3"]
server = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "sse-starlette>=2.0"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
machine3 = "leafmachine3.machine3:main"
lm3-setup = "leafmachine3.setup.hardware_setup:main"

[project.urls]
Homepage = "https://github.com/Gene-Weaver/LeafMachine3"

[tool.setuptools.packages.find]
include = ["leafmachine3*"]

[tool.setuptools.package-data]
leafmachine3 = ["core/schema.sql"]
# The calibration sheets are resolved with importlib.resources (paths.calibration_images_dir), so
# they MUST ship inside the package -- an install that omits them silently drops `--calibrate` back
# to heuristic VRAM estimates. Downscaled copies of examples/images, ~7 MB total; see that package's
# README before swapping the set.
"leafmachine3.setup.calibration_images" = ["*.jpg", "README.md"]

[tool.ruff]
line-length = 110
target-version = "py310"
