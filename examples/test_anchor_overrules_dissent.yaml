version: 3
project:
  run_name: test_anchor_overrules_dissent
  input:
    dirs:
    - /datac/Labelbox_Dump/LM3/examples/images
    recursive: true
    image_extensions:
    - .jpg
    - .jpeg
    - .png
    - .tif
    - .tiff
  output:
    dir: /datac/Labelbox_Dump/LM3/examples_out
    tmp_dir: auto
  run_mode:
    overwrite: false
    restart: []
    fail_fast: false
  logging:
    level: INFO
    to_file: true
    to_console: true
compute:
  devices: auto
  tensorrt: false
  mock: false
  longest_first: true
  vram:
    safety_fraction: 0.9
    reserve_mb: 1024
    per_worker_mb: auto
    max_workers_per_gpu: 16
    headroom_factor: 1.15
    concurrent_warm_loads: 4
  workers:
    default: auto
    ruler_cf: 8
  onnxruntime:
    providers: auto
    ld_library_path: auto
    allow_cpu_fallback: false
  precision: fp16
ingest:
  max_working_dim: 3200
  jpg_quality: 100
naming:
  bbox_prefix: BBOX
  seg_prefix: SEG
  seg_rgb_prefix: SEGRGB
  mask_full_prefix: MaskFull
  mask_rgb_full_prefix: MaskRGBFull
  landmark_prefix: LM
  petiole_prefix: PET
  bilateral_prefix: BSYM
  friendly_names:
    Ruler: ruler
    Barcode: barcode
    Colorcard: colorcard
    Label: label
    Map: map
    Envelope: envelope
    Photo: photo
    Attached_Item: attachedItem
    Weights: weights
    Leaf_WHOLE: leaf
    Leaf_PARTIAL: leafReject
    Leaflet: leaflet
    Seed_Fruit_ONE: fruit
    Seed_Fruit_MANY: fruitMany
    Flower_ONE: flower
    Flower_MANY: flowerMany
    Bud: bud
    Specimen: specimen
    Specimen_Inverse: specimenInverse
    Roots: roots
    Wood: wood
    Leaf: leaf
    Petiole: petiole
    Hole: hole
modules:
  mp_conversion_factor:
    enabled: true
    model:
      path: ../models/mp_conversion_factor/model.json
      format: json
  archival_detector:
    enabled: true
    model:
      path: ../models/archival_detector/model.onnx
      format: onnx
    imgsz: 1280
    conf: 0.25
    iou: 0.6
    max_det: 100
    min_box_area: 128
    classes:
    - Ruler
    - Barcode
    - Colorcard
    - Label
    - Map
    - Envelope
    - Photo
    - Attached_Item
    - Weights
    dedup:
      enabled: true
      overlap: 0.95
      metric: min
  plant_detector:
    enabled: true
    model:
      path: ../models/plant_detector/model.onnx
      format: onnx
    imgsz: 1280
    conf: 0.3
    iou: 0.55
    max_det: 1000
    min_box_area: 40
    classes:
    - Leaf_WHOLE
    - Leaf_PARTIAL
    - Seed_Fruit_ONE
    - Seed_Fruit_MANY
    - Flower_ONE
    - Flower_MANY
    - Bud
    - Roots
    - Wood
    dedup:
      enabled: true
      overlap: 0.95
      metric: min
  specimen_segmenter:
    enabled: true
    model:
      path: ../models/specimen_segmenter/unet_masksFromSam3_paperclean_control_1024.onnx
      format: onnx
    imgsz: 1024
    conf: 0.5
    paperclean: true
  phenology_detector:
    enabled: true
    targets:
      leaves:
        min_conf: 0.35
        min_count: 1
      flowers:
        min_conf: 0.4
        min_count: 1
      fruits:
        min_conf: 0.4
        min_count: 1
  ruler_classifier:
    enabled: true
    models_dir: ../models/ruler_classifier
    ensemble_members:
    - yolo26x_cls_224
    - yolo26n_cls_224
    - dinov2_frozen_mlp
    min_conf: 0.35
    squarify:
      sz: 720
      method: tile_four
  ruler_cf:
    enabled: true
    anchor_tol: 0.25
    min_frame_cm: null
  leaf_segmenter:
    enabled: true
    model:
      path: ../models/leaf_segmenter/model.onnx
      format: onnx
    include_partial: false
    imgsz: 1024
    conf: 0.3
    iou: 0.5
    retina_masks: true
    max_det: 100
    mask_storage:
      format: polygon_xy
      min_area_px: 64
  morphology:
    enabled: true
    classes:
    - Leaf
    method: pca
    find_minimum_bounding_box: true
  landmark_detector:
    enabled: true
    model:
      path: ../models/landmark_detector/model.onnx
      format: onnx
    source_classes:
    - Leaf_WHOLE
    include_partial: false
    imgsz: 640
    conf: 0.25
    iou: 0.45
    white_pad: 0.1
  landmark_measurements:
    enabled: true
    min_kpt_conf: 0.25
  leaf_orientation:
    enabled: true
    min_kpt_conf: 0.25
    min_midvein: 5
  petiole_width:
    enabled: true
    min_kpt_conf: 0.25
    touch_dist_px: 20
  bilateral_symmetry:
    enabled: true
    min_kpt_conf: 0.25
    n_bins: 200
    min_score: 0.5
    qc_images: flagged
  metric_grounding:
    enabled: true
    missing_cf_policy: skip
    round_ndigits: 4
  reporter:
    enabled: true
  ect:
    enabled: true
    include_petiole: false
    include_holes: false
    num_dirs: 360
    bound_radius: 1
    palette: magma
    apply_log_to_visual_for_bold_color: true    # log-scale the visuals (pictures only)
    radial_viz: true
    cartesian_viz: true
    radial_overlay_viz: true
    outline_simple: true
    simplify_tolerance: 0.0025
    simplify_cutoff: 1000
    export_literal_coords: false
report:
  overlay:
    enabled: true
    box_style: rotated
    draw_masks: true
    draw_landmarks: true
    draw_petiole: true
    draw_labels: true
    draw_confidence: true
    draw_cf_banner: true
    insert_cf_in_rulers: true
    insert_cf_exterior: true
    cf_scalebar:
      cm_color:
      - 0
      - 255
      - 255
      inch_color:
      - 0
      - 255
      - 0
      raft_color:
      - 255
      - 255
      - 255
      brim: 3
      bar_thickness: 10
      exterior_cells: 2
      exterior_light:
      - 255
      - 255
      - 255
      exterior_dark:
      - 0
      - 0
      - 0
    groups:
      leaf:
        border: true
        fill: false
        fill_alpha: 0.3
        line_width: 3
      plant:
        border: true
        fill: false
        fill_alpha: 0.3
        line_width: 3
      archival:
        border: false
        fill: true
        fill_alpha: 0.3
        line_width: 3
    alpha: 0.45
    line_width_mask: 2
    font_scale: 1
    label_text_color:
    - 255
    - 255
    - 255
    cf_banner_color:
    - 255
    - 255
    - 255
    classes:
      archival:
        Ruler:
          color:
          - 255
          - 0
          - 70
          show: true
        Barcode:
          color:
          - 0
          - 137
          - 65
          show: true
        Colorcard:
          color:
          - 242
          - 255
          - 0
          show: true
        Label:
          color:
          - 0
          - 0
          - 255
          show: true
        Map:
          color:
          - 0
          - 251
          - 255
          show: true
        Envelope:
          color:
          - 163
          - 0
          - 89
          show: true
        Photo:
          color:
          - 255
          - 205
          - 220
          show: true
        Attached_Item:
          color:
          - 255
          - 172
          - 40
          show: true
        Weights:
          color:
          - 140
          - 140
          - 140
          show: true
      plant:
        Leaf_WHOLE:
          color:
          - 0
          - 255
          - 55
          show: true
        Leaf_PARTIAL:
          color:
          - 0
          - 255
          - 250
          show: true
        Leaflet:
          color:
          - 255
          - 203
          - 0
          show: true
        Seed_Fruit_ONE:
          color:
          - 252
          - 255
          - 0
          show: true
        Seed_Fruit_MANY:
          color:
          - 0
          - 0
          - 80
          show: true
        Flower_ONE:
          color:
          - 255
          - 52
          - 255
          show: true
        Flower_MANY:
          color:
          - 154
          - 0
          - 255
          show: true
        Bud:
          color:
          - 255
          - 0
          - 9
          show: true
        Specimen:
          color:
          - 0
          - 0
          - 0
          show: true
        Roots:
          color:
          - 255
          - 134
          - 0
          show: true
        Wood:
          color:
          - 144
          - 22
          - 22
          show: true
      segmentation:
        Leaf:
          color:
          - 46
          - 255
          - 0
          show: true
        Petiole:
          color:
          - 255
          - 0
          - 150
          show: true
        Hole:
          color:
          - 200
          - 0
          - 255
          show: true
    landmark:
      draw_points: true
      draw_skeleton: true
      point_radius: 4
      line_width: 2
      min_conf: 0.25
      label_color:
      - 255
      - 255
      - 255
      curvature_color:
      - 0
      - 0
      - 0
      colors:
        lamina:
        - 255
        - 255
        - 255
        midvein:
        - 0
        - 200
        - 255
        apex:
        - 255
        - 60
        - 60
        base:
        - 255
        - 60
        - 255
        petiole:
        - 255
        - 170
        - 0
        width:
        - 0
        - 255
        - 128
    petiole:
      width_color:
      - 3
      - 32
      - 252
      sample_color:
      - 6
      - 124
      - 191
      band_thickness: 4
      sample_thickness: 2
      mask_alpha: 0.45
      label_color:
      - 255
      - 255
      - 255
      zoom_bg_tint: 0
      zoom_bg_color:
      - 255
      - 0
      - 0
  overlay_landmarks:
    enabled: true
  overlay_petiole:
    enabled: true
  overlay_specimen:
    enabled: true
    mask_color:
    - 70
    - 200
    - 70
    refined_color:
    - 235
    - 60
    - 60
    sample_box_color:
    - 30
    - 120
    - 245
    mask_alpha: 0.4
    refined_alpha: 0.55
    outline: true
    display_max_dim: 2048
  overlay_ruler_lattice:
    enabled: true
  masks:
    classes:
    - Leaf
    background: black
    subtract_holes: true
    Binary_Masks_Full_Image: true
    RGB_Masks_Full_Image: true
    Binary_Masks__Specimen: true
    RGB_Masks__Specimen: true
    Binary_Masks__Specimen_Inverse: true
    RGB_Masks__Specimen_Inverse: true
    inverse_fill: white
    Binary_Masks: true
    RGB_Masks: true
  crops:
    enabled: true
    classes: all
  leaf_products:
    enabled: true
    original: true
    oriented: true
    background: black
    fit_pad: 0
    hole_rgb_color:
    - 10
    - 10
    - 10
    products:
      bbox: true
      lamina_mask: true
      lamina_petiole_mask: true
      lamina_holes_mask: true
      lamina_rgb: true
      lamina_petiole_rgb: true
      lamina_holes_rgb: true
  formats:
    image_ext: jpg
    jpg_quality: 100
    mask_ext: png
timing:
  enabled: true
  sample_interval_s: 0.25
