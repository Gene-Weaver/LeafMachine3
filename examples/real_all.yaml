    - Leaf
    background: black
    subtract_holes: true
    Binary_Masks_Full_Image: true
    Binary_Masks: true
    RGB_Masks_Full_Image: true
    RGB_Masks: false
  crops:
    enabled: true
    classes: all
    source: working
  formats:
    image_ext: jpg
    jpg_quality: 100
    mask_ext: png
