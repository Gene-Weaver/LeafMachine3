# ============================================================================
# LM3_settings.yaml  --  LeafMachine3's single user control surface (INTENT).
# Paths may be absolute or relative to project.output.dir. Machine-derived perf
# settings live in hardware_settings.yaml (written by LM3_Setup); per-crop RESULTS
# live in the per-project SQLite DB. Precedence: defaults < hardware_settings.yaml
# < THIS file (explicit, non-"auto") < CLI.
# ============================================================================
version: 3

project:
  run_name: "demo"
  input:
    dirs: ["examples/images"]           # folder(s) of ORIGINAL images
    recursive: true
    image_extensions: [".jpg", ".jpeg", ".png", ".tif", ".tiff"]
  output:
    dir: "runs"                         # <dir>/<run_name>/ holds db, crops, reports, logs
    tmp_dir: "auto"                     # 'auto' -> hardware_settings.tmp_dir else <run>/_tmp
    keep_tmp: false
  run_mode:
    overwrite: false
    restart: []                         # [] resume | "all" | ["leaf_segmenter", ...]
    fail_fast: false
  logging: { level: "INFO", to_file: true, to_console: true }

compute:
  devices: "auto"                       # GPU-first: every visible NVIDIA GPU; CPU only if none | [0,1] | "cpu"
  tensorrt: false
  mock: false                           # true = deterministic synthetic models (no weights/GPU) for testing
  vram: { safety_fraction: 0.90, reserve_mb: 1024, per_worker_mb: "auto", max_workers_per_gpu: 6 }
  workers: { default: "auto", ruler_cf: 8 }
  onnxruntime: { providers: "auto", ld_library_path: "auto", allow_cpu_fallback: false }
  precision: "fp16"

ingest:
  max_working_dim: 3200                 # long-side cap; larger originals get a resized _tmp jpg
  jpg_quality: 100

# ----------------------------------------------------------------------------
# NAMING — crop / mask filenames are <stem>__<PREFIX>-<friendly>__x1_y1_x2_y2.<ext>
# (PREFIX = BBOX for detection boxes, SEG for segmentation masks). Rename the friendly
# values however you like — these are the defaults and drive folder + file names.
# ----------------------------------------------------------------------------
naming:
  bbox_prefix: "BBOX"                   # detection bbox crops:  <stem>__BBOX-<friendly>__x_y_x_y
  seg_prefix: "SEG"                     # per-crop seg masks:    <stem>__SEG-<friendly>__x_y_x_y
  mask_full_prefix: "MaskFull"          # full-image masks:      <stem>__MaskFull-<friendly>
  landmark_prefix: "LM"                 # per-leaf landmark overlay: <stem>__LM-<friendly>__x_y_x_y
  friendly_names:                       # real class name -> friendly name used in filenames
    # archival
    Ruler: ruler
    Barcode: barcode
    Colorcard: colorcard
    Label: label
    Map: map
    Envelope: envelope
    Photo: photo
    Attached_Item: attachedItem
    Weights: weights
    # plant organs
    Leaf_WHOLE: leaf
    Leaf_PARTIAL: leafReject
    Leaflet: leaflet
    Seed_Fruit_ONE: fruit
    Seed_Fruit_MANY: fruitMany
    Flower_ONE: flower
    Flower_MANY: flowerMany
    Bud: bud
    Specimen: specimen
    Roots: roots
    Wood: wood
    # segmentation instance classes
    Leaf: leaf
    Petiole: petiole
    Hole: hole

modules:

  archival_detector:
    enabled: true
    model: { path: "models/archival_detector/model.onnx", format: "onnx" }
    imgsz: 1280
    conf: 0.25
    iou: 0.60
    max_det: 100
    min_box_area: 128
    classes: [Ruler, Barcode, Colorcard, Label, Map, Envelope, Photo, Attached_Item, Weights]

  plant_detector:
    enabled: true
    model: { path: "models/plant_detector/model.onnx", format: "onnx" }
    imgsz: 1280
    conf: 0.30
    iou: 0.55
    max_det: 1000
    min_box_area: 40
    classes: [Leaf_WHOLE, Leaf_PARTIAL, Seed_Fruit_ONE, Seed_Fruit_MANY,
              Flower_ONE, Flower_MANY, Bud, Roots, Wood]

  phenology_detector:
    enabled: true
    targets:
      leaves:  { min_conf: 0.35, min_count: 1 }
      flowers: { min_conf: 0.40, min_count: 1 }
      fruits:  { min_conf: 0.40, min_count: 1 }

  ruler_classifier:
    enabled: true
    models_dir: "models/ruler_classifier"    # dir holding the ONNX ensemble members
    ensemble_members: [yolo26x_cls_224, yolo26n_cls_224, dinov2_frozen_mlp]
    min_conf: 0.35

  ruler_cf:
    enabled: false                      # NOT YET IMPLEMENTED (tick-spacing math not ported) -- stub stage
    tick: { min_units: 3 }
    agree_tol: 0.05
    second_unit: { enabled: true, cross_tol: 0.03 }
    cf_policy: "max_quality"
    on_failure: "null_cf"

  leaf_segmenter:
    enabled: true
    model: { path: "models/leaf_segmenter/model.pt", format: "pytorch" }   # exported .onnx when available
    include_partial: false
    imgsz: 1024
    conf: 0.30
    iou: 0.50
    retina_masks: true
    max_det: 50
    mask_storage: { format: "polygon_xy", min_area_px: 64 }   # polygon_xy (no extra deps) | coco_rle

  morphology:                           # runs right after leaf_segmenter
    enabled: true
    classes: ["Leaf"]                   # seg classes to measure (Petiole / Hole addable later)
    method: "pca"                       # rotated-bbox algorithm (DEFAULT: "pca" = area-weighted
                                        #   principal axis; robust across the broadest range of leaf
                                        #   shapes). Options: "pca" | "feret" (max-Feret axis) |
                                        #   "lm2" (fit_min_bbox) | "minarearect" (cv2, can mis-orient).
    find_minimum_bounding_box: true     # (lm2 only) run the rotate-to-min-circle procedure

  landmark_detector:                    # leaf-landmark pose (31-kpt mid15_pet5); runs on leaf crops
    enabled: true
    model: { path: "models/landmark_detector/model.onnx", format: "onnx" }
    source_classes: ["Leaf_WHOLE"]
    include_partial: false              # true also landmarks Leaf_PARTIAL crops
    imgsz: 640
    conf: 0.25
    iou: 0.45
    white_pad: 0.10                     # training white border re-applied at inference then removed

  landmark_measurements:                # derives measurements from the keypoints (post-process, CPU)
    enabled: true
    min_kpt_conf: 0.25                  # keypoints below this are "occluded/absent"; metrics null out

  metric_grounding:
    enabled: true                       # runs, but no-ops until ruler_cf provides a CF
    missing_cf_policy: "skip"
    round_ndigits: 4

  reporter:
    enabled: true

report:
  # ---- Summary_Image overlay -------------------------------------------------
  # ALL overlay colors AND per-part display flags live here so users can fully
  # restyle the overlay without touching code. Colors are [R, G, B] (0-255); the
  # defaults below are the LeafMachine2 palette. `show: false` hides that class.
  overlay:
    enabled: true
    # global part toggles
    draw_boxes_archival: true       # draw ArchivalDetector boxes (Ruler, Label, ...)
    draw_boxes_plant: true          # draw PlantDetector boxes (Leaf_WHOLE, Flower, ...)
    box_style: "rotated"            # leaf boxes: "rotated" (min bounding box from Morphology) | "yolo"
    draw_masks: true                # draw LeafSegmenter instance masks (Leaf/Petiole/Hole)
    draw_landmarks: true            # draw leaf keypoints + skeleton ON TOP of masks/boxes
    draw_labels: true               # draw the class-name text on each box/mask
    draw_confidence: true           # append the confidence score to the label
    draw_cf_banner: true            # print the derived CF (px/cm) banner on the sheet
    # global style
    alpha: 0.45                     # mask/box fill transparency, 0 (clear) .. 1 (opaque)
    line_width_archival: 3          # box outline width for archival detections
    line_width_plant: 3             # box outline width for plant detections
    line_width_mask: 2              # mask outline width
    font_scale: 1.0                 # label text size multiplier
    label_text_color: [255, 255, 255]
    cf_banner_color: [255, 255, 255]
    # per-class color [R,G,B] + visibility. Defaults = LeafMachine2 palette.
    classes:
      archival:
        Ruler:         { color: [255, 0, 70],    show: true }
        Barcode:       { color: [0, 137, 65],    show: true }
        Colorcard:     { color: [242, 255, 0],   show: true }
        Label:         { color: [0, 0, 255],     show: true }
        Map:           { color: [0, 251, 255],   show: true }
        Envelope:      { color: [163, 0, 89],    show: true }
        Photo:         { color: [255, 205, 220], show: true }
        Attached_Item: { color: [255, 172, 40],  show: true }
        Weights:       { color: [140, 140, 140], show: true }
      plant:
        Leaf_WHOLE:      { color: [0, 255, 55],   show: true }
        Leaf_PARTIAL:    { color: [0, 255, 250],  show: true }
        Leaflet:         { color: [255, 203, 0],  show: true }
        Seed_Fruit_ONE:  { color: [252, 255, 0],  show: true }
        Seed_Fruit_MANY: { color: [0, 0, 80],     show: true }
        Flower_ONE:      { color: [255, 52, 255],  show: true }
        Flower_MANY:     { color: [154, 0, 255],  show: true }
        Bud:             { color: [255, 0, 9],    show: true }
        Specimen:        { color: [0, 0, 0],      show: true }
        Roots:           { color: [255, 134, 0],  show: true }
        Wood:            { color: [144, 22, 22],  show: true }
      segmentation:
        Leaf:    { color: [46, 255, 0],   show: true }
        Petiole: { color: [255, 0, 150],  show: true }
        Hole:    { color: [200, 0, 255],  show: true }
    # landmark drawing (points + skeleton), shared by Overlay_Summary + Overlay_Landmarks.
    # Colors are per keypoint GROUP; points below min_conf are hidden (occluded/uncertain).
    landmark:
      draw_points: true
      draw_skeleton: true
      point_radius: 4
      line_width: 2
      min_conf: 0.25
      label_color: [255, 255, 255]
      colors:                         # [R, G, B] per keypoint group
        lamina:  [255, 255, 255]      # lamina_tip / lamina_base anchors
        midvein: [0, 200, 255]        # midrib trace
        apex:    [255, 60, 60]        # apex triple
        base:    [255, 60, 255]       # base triple
        petiole: [255, 170, 0]        # petiole trace + tip
        width:   [0, 255, 128]        # width_left / width_right
  # ---- per-leaf landmark overlay --------------------------------------------
  # One image per leaf under Overlay/Overlay_Landmarks/<stem>__LM-leaf__x_y_x_y.<ext>:
  # keypoints + skeleton drawn on the crop plus a panel of the derived measurements
  # (lamina trace/extent, width, apex/base angle + type, petiole trace, curvature).
  overlay_landmarks:
    enabled: true                     # optional; on by default. Styling reuses overlay.landmark.
  # ---- segmentation mask exports --------------------------------------------
  # Each toggle writes a folder named <toggle>__<Class> for every class in `classes`.
  # Full_Image variants = one file per specimen (original frame); the others = one file
  # per leaf CROP (crop frame), named <stem>__SEG-<friendly>__x1_y1_x2_y2.<ext>.
  masks:
    classes: ["Leaf"]                   # segmentation classes to export (Leaf | Petiole | Hole)
    background: "black"                 # black | white  (RGB_* outputs)
    subtract_holes: true                # Leaf minus Hole for binary/rgb
    Binary_Masks_Full_Image: true       # -> Binary_Masks_Full_Image__Leaf/<stem>.png
    Binary_Masks: true                  # -> Binary_Masks__Leaf/<stem>__SEG-leaf__x_y_x_y.png
    RGB_Masks_Full_Image: true          # -> RGB_Masks_Full_Image__Leaf/<stem>.jpg
    RGB_Masks: false                    # -> RGB_Masks__Leaf/<stem>__SEG-leaf__x_y_x_y.jpg
  # ---- raw RGB crop exports (both detectors) --------------------------------
  # Exports the plain bbox crops into Crops/RGB__<friendly>/ (one folder per class).
  crops:
    enabled: true
    classes: "all"                      # "all", or a list of real class names e.g. [Leaf_WHOLE, Ruler]
    source: "working"                   # working (matches detector crops) | original (full-res)
  formats: { image_ext: "jpg", jpg_quality: 100, mask_ext: "png" }
