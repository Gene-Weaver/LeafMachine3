<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LeafMachine3 — TODO</title>
<style>
 :root{
   --bg:#0f1115; --panel:#171a21; --panel2:#1d222b; --bd:#2a2e37; --tx:#e8eaed; --mut:#9aa0a6;
   --acc:#4ec98f; --acc2:#7cc7a0; --warn:#e0a13b; --link:#7cc7a0; --code:#20252e;
 }
 @media (prefers-color-scheme: light){
   :root{ --bg:#f6f7f9; --panel:#fff; --panel2:#f0f2f5; --bd:#dfe3e8; --tx:#1b1f24; --mut:#5b626b;
     --acc:#1f9e63; --acc2:#177a4c; --warn:#a76a12; --link:#177a4c; --code:#eef1f4; }
 }
 *{box-sizing:border-box}
 body{font:15px/1.55 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--tx);margin:0}
 .wrap{max-width:1000px;margin:0 auto;padding:1.2rem 1.4rem 6rem}
 header.bar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--bd);
   padding:.6rem 0 .55rem;margin-bottom:1rem;display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
 h1#title{font-size:1.35rem;margin:0;flex:1 1 240px;min-width:180px}
 .btn{background:var(--panel2);color:var(--tx);border:1px solid var(--bd);border-radius:7px;
   padding:.32rem .6rem;font-size:.82rem;cursor:pointer}
 .btn:hover{border-color:var(--acc)}
 .btn.p{background:var(--acc);color:#04120a;border-color:var(--acc);font-weight:600}
 .sync{font-size:.74rem;color:var(--mut);display:flex;align-items:center;gap:.3rem}
 .dot{width:.55rem;height:.55rem;border-radius:50%;background:var(--mut);display:inline-block}
 .dot.on{background:var(--acc)}
 label.tg{font-size:.8rem;color:var(--mut);display:flex;align-items:center;gap:.35rem;cursor:pointer;user-select:none}
 #counts{font-size:.76rem;color:var(--mut)}
 #intro{color:var(--mut);font-size:.9rem;border-left:3px solid var(--bd);padding:.1rem 0 .1rem .9rem;margin:.2rem 0 1.4rem}
 .item{background:var(--panel);border:1px solid var(--bd);border-radius:10px;padding:.7rem .9rem;margin:.7rem 0;transition:opacity .15s}
 .item .hd{display:flex;align-items:flex-start;gap:.55rem}
 .item .chk{width:1.15rem;height:1.15rem;margin-top:.15rem;flex:0 0 auto;cursor:pointer;accent-color:var(--acc)}
 .item .num{background:var(--panel2);border:1px solid var(--bd);color:var(--mut);border-radius:6px;
   min-width:1.7rem;text-align:center;font-size:.8rem;padding:.05rem .3rem;margin-top:.05rem;flex:0 0 auto}
 .item h2{font-size:1.03rem;margin:0;flex:1 1 auto;line-height:1.4}
 .item .tools{display:flex;gap:.25rem;flex:0 0 auto;opacity:.35;transition:opacity .12s}
 .item:hover .tools{opacity:1}
 .tools .btn{padding:.16rem .4rem;font-size:.74rem}
 .body{margin:.5rem 0 0 2.9rem}
 .body p{margin:.4rem 0} .body h3,.body h4,.body h5{margin:.7rem 0 .3rem;font-size:1rem}
 .body ul,.body ol{margin:.35rem 0 .35rem 1.1rem;padding:0} .body li{margin:.15rem 0}
 .body code{background:var(--code);padding:.05rem .3rem;border-radius:4px;font-size:.86em}
 .body pre{background:var(--code);padding:.6rem .8rem;border-radius:7px;overflow-x:auto}
 .body pre code{background:none;padding:0}
 .body a{color:var(--link)} .body hr{border:none;border-top:1px solid var(--bd);margin:.7rem 0}
 .body blockquote{border-left:3px solid var(--bd);margin:.4rem 0;padding:.1rem 0 .1rem .8rem;color:var(--mut)}
 .body table{border-collapse:collapse;margin:.5rem 0;font-size:.86rem;display:block;overflow-x:auto}
 .body th,.body td{border:1px solid var(--bd);padding:.3rem .5rem;text-align:left;vertical-align:top}
 .body th{background:var(--panel2)}
 .notes{margin:.5rem 0 0 2.9rem}
 .note{background:var(--panel2);border:1px solid var(--bd);border-left:3px solid var(--warn);border-radius:6px;
   padding:.35rem .6rem;margin:.35rem 0;font-size:.88rem;position:relative}
 .note .nt-tools{position:absolute;right:.35rem;top:.3rem;display:flex;gap:.2rem;opacity:.4}
 .note:hover .nt-tools{opacity:1}
 .item.done{opacity:.5} .item.done h2{text-decoration:line-through;text-decoration-color:var(--mut)}
 .item.cleared{opacity:.4;border-style:dashed}
 .item.cleared::before{content:"cleared";position:absolute;font-size:.62rem;color:var(--warn);
   text-transform:uppercase;letter-spacing:.05em}
 .item{position:relative}
 .ed{width:100%;background:var(--panel2);color:var(--tx);border:1px solid var(--acc);border-radius:7px;
   padding:.45rem .6rem;font:inherit;font-size:.9rem}
 textarea.ed{min-height:9rem;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.82rem;line-height:1.5}
 .edrow{display:flex;gap:.4rem;margin-top:.4rem;align-items:center}
 .addbar{margin:1.5rem 0 0 0;display:flex;gap:.5rem}
 .hint{font-size:.74rem;color:var(--mut);margin-top:.2rem}
 .item.dragover{border-color:var(--acc)}
</style>
</head>
<body>
<script id="seed" type="application/json">__SEED__</script>
<div class="wrap">
 <header class="bar">
   <h1 id="title" title="click ✎ to edit">…</h1>
   <span class="sync"><span class="dot" id="dot"></span><span id="syncmsg">local only</span></span>
   <span id="counts"></span>
   <label class="tg"><input type="checkbox" id="hideToggle"> hide done/cleared</label>
   <button class="btn" data-action="edit-title" title="edit title">✎ title</button>
   <button class="btn" data-action="edit-intro">✎ intro</button>
   <button class="btn" id="connectBtn" data-action="connect" title="open todo.json to auto-save edits back to it">🔗 connect todo.json</button>
   <button class="btn" data-action="save" title="save-as / download todo.json">💾 save</button>
   <button class="btn" data-action="import" title="load a todo.json (replaces current)">📂 import</button>
 </header>
 <div id="introwrap"><div id="intro"></div></div>
 <div id="items"></div>
 <div class="addbar"><button class="btn p" data-action="add-item">＋ add item</button>
   <span class="hint">Edits auto-save to <code>todo.json</code> once connected (Chrome/Edge), else to this browser + use “save” to download. Claude edits <code>todo.json</code> to add/clear items.</span></div>
</div>
<input type="file" id="fileIn" accept=".json,application/json" style="display:none">

<script>
const seed = JSON.parse(document.getElementById('seed').textContent);
const LS = 'lm3_todo_v1';
const editing = new Set();
let DATA = restore();
let handle = null;
const $ = (s,r=document)=>r.querySelector(s);

function clone(o){ return JSON.parse(JSON.stringify(o)); }
function restore(){ try{ const s=localStorage.getItem(LS); if(s) return migrate(JSON.parse(s)); }catch(e){} return clone(seed); }
function migrate(d){ d.settings=d.settings||{hideDone:false}; d.items=(d.items||[]).map(it=>({notes:[],done:false,deleted:false,...it})); return d; }
function persist(){ try{ localStorage.setItem(LS, JSON.stringify(DATA)); }catch(e){} scheduleWrite(); }
let wt; function scheduleWrite(){ if(!handle) return; clearTimeout(wt); wt=setTimeout(writeFile,500); }
async function writeFile(){ try{ const w=await handle.createWritable(); await w.write(JSON.stringify(DATA,null,2)); await w.close(); setSync(true,'saved '+new Date().toLocaleTimeString()); }catch(e){ setSync(false,'save error'); } }
function setSync(on,msg){ $('#dot').className='dot'+(on?' on':''); $('#syncmsg').textContent=msg; }

/* ---------- tiny markdown ---------- */
function inline(s){
  s=(s||'').replace(/`([^`]+)`/g,(m,c)=>'<code>'+c.replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</code>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>');
  s=s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s;
}
function md(src){
  const L=(src||'').split('\n'); const out=[]; let i=0;
  const isBlock=l=>/^(#{1,6}\s|```|\s*[-*]\s|\s*\d+\.\s|>|\||-{3,}\s*$)/.test(l);
  while(i<L.length){
    let l=L[i];
    if(/^```/.test(l)){ const b=[]; i++; while(i<L.length&&!/^```/.test(L[i])){b.push(L[i]);i++;} i++;
      out.push('<pre><code>'+b.join('\n').replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</code></pre>'); continue; }
    if(/^\s*\|.*\|\s*$/.test(l) && i+1<L.length && /^[\s|:\-]*-[\s|:\-]*$/.test(L[i+1])){
      const rows=[]; while(i<L.length && /\|/.test(L[i])){ rows.push(L[i]); i++; }
      const cells=r=>r.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|').map(c=>c.trim());
      let t='<table><thead><tr>'+cells(rows[0]).map(h=>'<th>'+inline(h)+'</th>').join('')+'</tr></thead><tbody>';
      rows.slice(2).forEach(r=>{ t+='<tr>'+cells(r).map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>'; });
      out.push(t+'</tbody></table>'); continue;
    }
    if(/^#{1,6}\s/.test(l)){ const n=Math.min(6,l.match(/^#+/)[0].length+1); out.push('<h'+n+'>'+inline(l.replace(/^#+\s/,''))+'</h'+n+'>'); i++; continue; }
    if(/^\s*[-*]\s/.test(l)){ const it=[]; while(i<L.length&&/^\s*[-*]\s/.test(L[i])){ it.push('<li>'+inline(L[i].replace(/^\s*[-*]\s/,''))+'</li>'); i++; } out.push('<ul>'+it.join('')+'</ul>'); continue; }
    if(/^\s*\d+\.\s/.test(l)){ const it=[]; while(i<L.length&&/^\s*\d+\.\s/.test(L[i])){ it.push('<li>'+inline(L[i].replace(/^\s*\d+\.\s/,''))+'</li>'); i++; } out.push('<ol>'+it.join('')+'</ol>'); continue; }
    if(/^>\s?/.test(l)){ const b=[]; while(i<L.length&&/^>\s?/.test(L[i])){ b.push(L[i].replace(/^>\s?/,'')); i++; } out.push('<blockquote>'+inline(b.join(' '))+'</blockquote>'); continue; }
    if(/^-{3,}\s*$/.test(l)){ out.push('<hr>'); i++; continue; }
    if(/^\s*$/.test(l)){ i++; continue; }
    const b=[l]; i++; while(i<L.length && !/^\s*$/.test(L[i]) && !isBlock(L[i])){ b.push(L[i]); i++; }
    out.push('<p>'+inline(b.join(' '))+'</p>');
  }
  return out.join('\n');
}
function ta(val){ const t=document.createElement('textarea'); return t.value=val||'',t.value.replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ---------- render ---------- */
function render(){
  const hide=DATA.settings.hideDone;
  if(editing.has('title')) $('#title').innerHTML='<input class="ed" id="ttl" value="'+(DATA.title||'').replace(/"/g,'&quot;')+'"><div class="edrow"><button class="btn p" data-action="save-title">save</button><button class="btn" data-action="cancel" data-k="title">cancel</button></div>';
  else $('#title').innerHTML=inline(DATA.title||'TODO');
  if(editing.has('intro')) $('#intro').innerHTML='<textarea class="ed" id="intr">'+ta(DATA.intro)+'</textarea><div class="edrow"><button class="btn p" data-action="save-intro">save</button><button class="btn" data-action="cancel" data-k="intro">cancel</button></div>';
  else $('#intro').innerHTML=md(DATA.intro);
  const c=$('#items'); c.innerHTML=''; let a=0,d=0,x=0;
  DATA.items.forEach((it,ix)=>{
    if(it.done)d++; if(it.deleted)x++; if(!it.done&&!it.deleted)a++;
    if(hide && (it.done||it.deleted)) return;
    const el=document.createElement('section');
    el.className='item'+(it.done?' done':'')+(it.deleted?' cleared':''); el.dataset.id=it.id; el.dataset.ix=ix;
    el.innerHTML=card(it); c.appendChild(el);
  });
  $('#counts').textContent=`${a} active · ${d} done · ${x} cleared`;
  $('#hideToggle').checked=hide;
}
function card(it){
  const k='hd:'+it.id;
  let h;
  if(editing.has(k)){
    h='<div class="hd"><input type="checkbox" class="chk" disabled '+(it.done?'checked':'')+'>'
     +'<span class="num">'+esc(it.num)+'</span><div style="flex:1">'
     +'<input class="ed edhead" value="'+(it.heading||'').replace(/"/g,'&quot;')+'">'
     +'<textarea class="ed edbody" style="margin-top:.4rem">'+ta(it.body)+'</textarea>'
     +'<div class="edrow"><button class="btn p" data-action="save-item">save</button>'
     +'<button class="btn" data-action="cancel" data-k="'+k+'">cancel</button></div></div></div>';
    return h;
  }
  h='<div class="hd"><input type="checkbox" class="chk" data-action="toggle" '+(it.done?'checked':'')+'>'
   +'<span class="num">'+esc(it.num)+'</span><h2>'+inline(it.heading)+'</h2>'
   +'<div class="tools"><button class="btn" data-action="edit-item">✎</button>'
   +'<button class="btn" data-action="add-note">＋note</button>'
   +(it.deleted?'<button class="btn" data-action="restore">restore</button>':'<button class="btn" data-action="clear">🗑 clear</button>')
   +'</div></div>';
  if(it.body) h+='<div class="body">'+md(it.body)+'</div>';
  if(it.notes&&it.notes.length){ h+='<div class="notes">'; it.notes.forEach((n,ni)=>{ h+=note(it,n,ni); }); h+='</div>'; }
  return h;
}
function note(it,n,ni){
  const k='nt:'+it.id+':'+ni;
  if(editing.has(k)) return '<div class="note"><textarea class="ed ednote" data-ni="'+ni+'">'+ta(n)+'</textarea>'
    +'<div class="edrow"><button class="btn p" data-action="save-note" data-ni="'+ni+'">save</button>'
    +'<button class="btn" data-action="cancel" data-k="'+k+'">cancel</button></div></div>';
  return '<div class="note"><div class="nt-tools"><button class="btn" data-action="edit-note" data-ni="'+ni+'">✎</button>'
    +'<button class="btn" data-action="del-note" data-ni="'+ni+'">✕</button></div>'+md(n)+'</div>';
}
function esc(s){ return (s+'').replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function itemOf(node){ const s=node.closest('.item'); return s?DATA.items.find(i=>i.id===s.dataset.id):null; }

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-action]'); if(!b) return;
  const act=b.dataset.action; const it=itemOf(b); const ni=b.dataset.ni!==undefined?+b.dataset.ni:null;
  if(act==='toggle'){ it.done=b.checked; persist(); render(); }
  else if(act==='edit-item'){ editing.add('hd:'+it.id); render(); }
  else if(act==='save-item'){ const s=b.closest('.item'); it.heading=$('.edhead',s).value; it.body=$('.edbody',s).value; editing.delete('hd:'+it.id); persist(); render(); }
  else if(act==='clear'){ it.deleted=true; persist(); render(); }
  else if(act==='restore'){ it.deleted=false; persist(); render(); }
  else if(act==='add-note'){ it.notes.push(''); editing.add('nt:'+it.id+':'+(it.notes.length-1)); render(); }
  else if(act==='edit-note'){ editing.add('nt:'+it.id+':'+ni); render(); }
  else if(act==='save-note'){ const s=b.closest('.item'); it.notes[ni]=$('.ednote[data-ni="'+ni+'"]',s).value; editing.delete('nt:'+it.id+':'+ni); if(!it.notes[ni].trim())it.notes.splice(ni,1); persist(); render(); }
  else if(act==='del-note'){ it.notes.splice(ni,1); persist(); render(); }
  else if(act==='cancel'){ const it2=itemOf(b); const k=b.dataset.k; if(k&&k.startsWith('nt:')){ const idx=+k.split(':')[2]; if(it2&&!(it2.notes[idx]||'').trim())it2.notes.splice(idx,1);} editing.delete(k); render(); }
  else if(act==='add-item'){ const n=String((DATA.items.reduce((m,i)=>Math.max(m,+i.num||0),0))+1); const id='i'+Date.now(); DATA.items.push({id,num:n,heading:'New item',body:'',done:false,deleted:false,notes:[]}); editing.add('hd:'+id); persist(); render(); const el=document.querySelector('[data-id="'+id+'"]'); el&&el.scrollIntoView({behavior:'smooth',block:'center'}); }
  else if(act==='edit-title'){ editing.add('title'); render(); $('#ttl')&&$('#ttl').focus(); }
  else if(act==='save-title'){ DATA.title=$('#ttl').value; editing.delete('title'); persist(); render(); }
  else if(act==='edit-intro'){ editing.add('intro'); render(); }
  else if(act==='save-intro'){ DATA.intro=$('#intr').value; editing.delete('intro'); persist(); render(); }
  else if(act==='connect'){ connectFile(); }
  else if(act==='save'){ saveAs(); }
  else if(act==='import'){ $('#fileIn').click(); }
});
$('#hideToggle').addEventListener('change',e=>{ DATA.settings.hideDone=e.target.checked; persist(); render(); });
$('#fileIn').addEventListener('change',async e=>{ const f=e.target.files[0]; if(!f)return; try{ DATA=migrate(JSON.parse(await f.text())); persist(); render(); setSync(false,'imported (not linked — use connect to auto-save)'); }catch(err){ alert('bad JSON: '+err.message); } e.target.value=''; });

async function connectFile(){
  if(!('showOpenFilePicker' in window)){ alert('This browser lacks the File System Access API (use Chrome/Edge). Falling back to import/download.'); return; }
  try{ [handle]=await window.showOpenFilePicker({types:[{description:'todo.json',accept:{'application/json':['.json']}}]});
    const perm=await handle.requestPermission({mode:'readwrite'}); if(perm!=='granted'){ setSync(false,'permission denied'); return; }
    const txt=await (await handle.getFile()).text(); DATA=migrate(JSON.parse(txt)); persist(); render(); setSync(true,'connected — auto-saving');
  }catch(err){ if(err.name!=='AbortError') alert(err.message); }
}
async function saveAs(){
  if('showSaveFilePicker' in window){ try{ handle=await window.showSaveFilePicker({suggestedName:'todo.json',types:[{description:'todo.json',accept:{'application/json':['.json']}}]}); await writeFile(); render(); return; }catch(err){ if(err.name==='AbortError')return; } }
  const blob=new Blob([JSON.stringify(DATA,null,2)],{type:'application/json'}); const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='todo.json'; a.click();
}
if(!('showOpenFilePicker' in window)) $('#connectBtn').style.display='none';
render();
</script>
</body>
</html>
